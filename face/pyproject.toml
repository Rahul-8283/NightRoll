[project]
name = "nightroll-face-worker"
version = "0.1.0"
description = "Internal face embedding and anti-spoofing service for NightRoll"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "insightface>=0.7.3",
    "numpy>=1.26.0,<2.0.0",
    "onnxruntime>=1.19.0",
    "opencv-python-headless>=4.10.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "supabase>=2.10.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
