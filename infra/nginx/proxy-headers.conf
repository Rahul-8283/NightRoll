# Headers every proxied request gets. Included by each proxy location in nightroll.conf.
#
# X-Forwarded-For is set to the address nginx saw, replacing whatever the client sent. The API reads it only
# when the connection comes from TRUSTED_PROXY_IPS, and takes the last entry, so a phone outside the room
# cannot claim an address inside it (Phase 12, task 2.4).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $request_id;
