# NightRoll reverse proxy (Phase 12, section 2).
#
# The nginx image turns this file into /etc/nginx/conf.d/nightroll.conf when the container starts, replacing
# ${SERVER_NAME} and ${SUPABASE_ORIGIN} from the container's environment. nginx's own variables ($host,
# $remote_addr, ...) are left alone because only names that exist in the environment are replaced.

log_format nightroll escape=json
  '{"ts":"$time_iso8601","level":"INFO","logger":"nginx","message":"request","request_id":"$request_id",'
  '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time_s":$request_time,"upstream_time_s":"$upstream_response_time"}';
access_log /dev/stdout nightroll;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Docker's own resolver, so a restarted container with a new address is found again without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# Plain HTTP only redirects. The one exception is the container's own health check, which nginx answers
# for requests coming from inside the container only.
server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  location = /healthz {
    allow 127.0.0.1;
    deny all;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://${SERVER_NAME}$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name ${SERVER_NAME};
  server_tokens off;

  # Certificate from the local certificate authority (mkcert). See infra/certs/README.md.
  ssl_certificate     /etc/nginx/certs/nightroll.pem;
  ssl_certificate_key /etc/nginx/certs/nightroll-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Security headers, sent on every response. The dashboard may talk only to this server and to Supabase.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: ${SUPABASE_ORIGIN}; font-src 'self' data:; connect-src 'self' wss://${SERVER_NAME} ${SUPABASE_ORIGIN}; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The live feed. The connection stays open for as long as the dashboard is, so the timeouts are long.
  location /v1/ws/ {
    set $api http://api:8000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass $api;
  }

  # Verification and enrollment carry camera frames. The API accepts a 64 KiB payload and five frames of
  # 1 MiB each, so 6 MiB covers the largest legitimate request with room for the form encoding.
  location ~ ^/v1/(attendance/verify|enrollments)$ {
    client_max_body_size 6m;
    set $api http://api:8000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_read_timeout 60s;
    proxy_pass $api;
  }

  location /v1/ {
    client_max_body_size 64k;
    set $api http://api:8000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_read_timeout 60s;
    proxy_pass $api;
  }

  # The dashboard. Files under /assets/ have the content hash in their name, so they can be cached for good.
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    expires -1;
    try_files $uri /index.html;
  }
}
