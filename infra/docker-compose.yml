# Local services for NightRoll. Phase 0 starts Redis only.
# Later phases add api, scheduler, face-worker, nginx (Phase 12).
# Run from the repo root:  docker compose -f infra/docker-compose.yml up -d

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
