[project]
name = "nightroll-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
